<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TVMaster</title>
<style>
  :root {
    --bg: #0b0d12; --panel: rgba(255,255,255,.07); --edge: rgba(255,255,255,.14);
    --text: #f2f4f8; --dim: #9aa3b2; --accent: #6ea8ff; --ok: #4fd18b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #e9edf5; --panel: rgba(255,255,255,.65); --edge: rgba(0,0,0,.10);
            --text: #11151c; --dim: #566074; --accent: #1a5fd6; --ok: #138a4f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; gap: 16px; padding: 16px; }
  .glass { background: var(--panel); border: 1px solid var(--edge); border-radius: 18px;
    -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); }
  #screen { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  #stage { position: relative; flex: 1; min-height: 0; background: #000; border-radius: 18px; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #osd { position: absolute; top: 14px; left: 16px; padding: 8px 14px; border-radius: 12px;
    background: rgba(0,0,0,.55); color: #fff; font-weight: 600; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #osd.show { opacity: 1; }
  #off { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #000; color: #666; }
  #side { width: 300px; padding: 12px; overflow: auto; flex-shrink: 0; }
  h1 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 4px 8px 10px; }
  h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 14px 8px 4px; }
  .ch { display: flex; gap: 10px; width: 100%; text-align: left; padding: 10px; border: 0; border-radius: 12px;
    background: transparent; color: inherit; cursor: pointer; font: inherit; }
  .ch:hover { background: var(--panel); }
  .ch.active { background: color-mix(in srgb, var(--accent) 22%, transparent); outline: 1px solid var(--edge); }
  .num { min-width: 2ch; font-weight: 700; color: var(--accent); }
  .meta { min-width: 0; } .name { font-weight: 600; }
  .now, .next { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  #bar .t { font-weight: 600; } #bar .s { color: var(--dim); font-size: 13px; }
  .hint { color: var(--dim); font-size: 12px; padding: 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  /* remote mode */
  body.remote #screen, body.remote #side { display: none; }
  #remote { display: none; flex-direction: column; gap: 12px; width: 100%; max-width: 480px; margin: 0 auto; padding: 16px; }
  body.remote #remote { display: flex; }
  #remote .row { display: flex; gap: 10px; }
  #remote button.big { flex: 1; padding: 18px; border-radius: 16px; border: 1px solid var(--edge); background: var(--panel);
    color: inherit; font: inherit; font-weight: 700; font-size: 18px; cursor: pointer; }
  #remote button.big:active { background: color-mix(in srgb, var(--accent) 30%, transparent); }
  body.tv #side, body.tv #bar { display: none; }
  body.tv { padding: 0; } body.tv #stage { border-radius: 0; }
  @media (max-width: 760px) { body:not(.remote) { flex-direction: column; } #side { width: 100%; max-height: 40vh; } }
  /* Overlays: the channel banner, number entry and channel list. Used on every screen, sized for the couch on a TV. */
  #banner { position: absolute; left: 4%; right: 4%; bottom: 6%; display: none; gap: 22px; align-items: center; padding: 18px 26px;
    border-radius: 22px; background: rgba(8,10,16,.82); border: 1px solid var(--edge); color: #fff; }
  #banner.show { display: flex; }
  #banner .b-num { font-size: 56px; font-weight: 800; color: var(--accent); min-width: 2.2ch; text-align: center; }
  #banner .b-name { font-size: 28px; font-weight: 700; } #banner .b-now { font-size: 22px; } #banner .b-next { font-size: 18px; color: var(--dim); }
  #entry { position: absolute; top: 5%; right: 5%; padding: 10px 24px; border-radius: 16px; background: rgba(8,10,16,.82); color: #fff;
    font-size: 64px; font-weight: 800; letter-spacing: .08em; display: none; font-variant-numeric: tabular-nums; }
  #entry.show { display: block; } #entry small { display: block; font-size: 16px; font-weight: 500; letter-spacing: 0; color: var(--dim); }
  #picker { position: absolute; top: 0; bottom: 0; left: 0; width: min(560px, 80%); display: none; flex-direction: column; padding: 22px 18px;
    background: linear-gradient(90deg, rgba(6,8,14,.94), rgba(6,8,14,.80) 85%, rgba(6,8,14,0)); color: #fff; }
  #picker.show { display: flex; } #picker h1 { color: #cbd3e1; font-size: 15px; margin: 0 8px 10px; }
  #plist { overflow: hidden; flex: 1; }
  #plist .row { display: flex; gap: 16px; align-items: center; padding: 10px 14px; border-radius: 14px; font-size: 22px; border: 2px solid transparent; }
  #plist .row.sel { background: color-mix(in srgb, var(--accent) 30%, rgba(0,0,0,.4)); border-color: var(--accent); }
  #plist .row.cur .num::after { content: " ●"; font-size: 12px; vertical-align: middle; }
  #plist .num { min-width: 2.4ch; font-weight: 800; color: var(--accent); font-size: 26px; }
  #plist .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #plist .nw { font-size: 16px; color: #aab3c4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #plist .col { min-width: 0; }
  #hint { position: absolute; bottom: 14px; left: 20px; right: 20px; text-align: center; color: #9aa3b2; font-size: 15px; }
  #start { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); color: #fff; font-size: 30px; font-weight: 700; text-align: center; padding: 0 8%; }
  #start.show { display: flex; }
  body.tvui { padding: 0; cursor: none; overflow: hidden; } body.tvui #side, body.tvui #bar { display: none; } body.tvui #stage { border-radius: 0; }
  body.tvui #screen { gap: 0; }
</style>
</head>
<body>
<div id="screen">
  <div id="stage"><video id="v" autoplay playsinline></video><div id="osd"></div><div id="off">Off</div>
    <div id="banner"><div class="b-num"></div><div><div class="b-name"></div><div class="b-now"></div><div class="b-next"></div></div></div>
    <div id="entry"></div>
    <div id="picker"><h1>Channels</h1><div id="plist"></div><div id="hint">▲▼ choose · OK watch · Back close</div></div>
    <div id="start">Press OK to start</div></div>
  <div id="bar" class="glass"><div><div class="t" id="t">TVMaster</div><div class="s" id="s">Pick a channel</div></div></div>
</div>
<aside id="side" class="glass"><h1>Channels</h1><div id="list"></div>
  <div class="hint">↑ / ↓ or PageUp / PageDown change channel · type a number · Enter list · F fullscreen</div></aside>
<div id="remote" class="glass">
  <h1 id="rtitle">Remote</h1>
  <div class="row"><button class="big" id="rup">Ch ▲</button><button class="big" id="rdown">Ch ▼</button></div>
  <div class="row"><button class="big" id="rvolm">Vol −</button><button class="big" id="rmute">Mute</button><button class="big" id="rvolp">Vol +</button></div>
  <div class="row"><button class="big" id="rpower">Power</button></div>
  <div id="rlist"></div>
</div>
<script src="/admin/vendor/hls.min.js"></script>
<script>
const q = new URLSearchParams(location.search);
const tvId = q.get('tv'), remoteId = q.get('remote');
const $ = id => document.getElementById(id);
const v = $('v');
let channels = [], current = null, previous = null, hls = null, osdTimer = null, tvState = null, ws = null, wsOk = false;
// A TV's own browser (Samsung, LG, Android TV, Fire TV, ...) or ?ui=tv gets the full-screen, remote-friendly screen.
const TV_UA = /Tizen|Web0S|webOS|SMART-TV|SmartTV|VIDAA|HbbTV|BRAVIA|AFTM|AFTT|AFTS|Android.*(TV|AFT)|CrKey|NetCast|Hisense|Roku/i;
const tvui = q.get('ui') === 'tv' || (q.get('ui') !== 'off' && TV_UA.test(navigator.userAgent));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, x) { try { localStorage.setItem(k, x); } catch {} } };

// A server with an access token: the address carries it once (?token=), the page remembers it and presents
// it everywhere, including to a TV's own video player, which cannot use a browser sign-in.
let token = q.get('token') || '';
if (token) { try { localStorage.setItem('tvmaster.token', token); } catch {} history.replaceState(null, '', location.pathname + location.hash); }
else { try { token = localStorage.getItem('tvmaster.token') || ''; } catch {} }
const tq = token ? `?token=${encodeURIComponent(token)}` : '';
const auth = opt => token ? { ...(opt || {}), headers: { ...((opt && opt.headers) || {}), authorization: 'Bearer ' + token } } : opt;
const needToken = () => { $('start').textContent = token ? 'That access token is not right' : 'This server needs its access token. Open this page once with ?token=YOUR_TOKEN on the end.'; $('start').classList.add('show'); };
const api = (p, opt) => fetch('/api/v1' + p, auth(opt)).then(r => r.ok ? r.json() : (r.status === 401 && needToken(), Promise.reject(r)));
const post = (p, body) => api(p, { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify(body) });
const fmt = ms => new Date(ms).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
const label = p => p ? (p.show ? `${p.show} — ${p.title}` : p.title) : '—';

function osd(text) {
  const o = $('osd'); o.textContent = text; o.classList.add('show');
  clearTimeout(osdTimer); osdTimer = setTimeout(() => o.classList.remove('show'), 2500);
}

function play(ch) {
  if (!ch || (current && current.id === ch.id && !v.paused)) return;
  if (current && current.id !== ch.id) previous = current;
  current = ch;
  if (!tvId && !remoteId) store.set('tvmaster.channel', ch.id);
  const url = `/stream/${ch.id}/index.m3u8${tq}`;
  if (hls) { hls.destroy(); hls = null; }
  // hls.js where the browser can run it (it is forgiving of small timestamp wobbles at the joins
  // between programmes, which strict built-in HLS players are not); the browser's own HLS otherwise (iPhone, iPad).
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ liveSyncDurationCount: 3, maxBufferLength: 20 });
    hls.loadSource(url); hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) setTimeout(() => { const c = current; current = null; play(c); }, 3000); });
  } else { v.src = url; }   // Safari plays HLS natively
  v.play().then(() => $('start').classList.remove('show')).catch(() => $('start').classList.add('show'));
  tvui ? banner() : osd(`${ch.number}  ${ch.name}`);
  render();
}

// Channels grouped under headings, in number order.
function grouped(list, make) {
  const frag = document.createDocumentFragment();
  let lastGroup = null;
  const groups = new Set(list.map(c => c.group || ''));
  for (const ch of list) {
    const g = ch.group || '';
    if (groups.size > 1 && g !== lastGroup) {
      const h = document.createElement('h2'); h.textContent = g || 'Other'; frag.appendChild(h); lastGroup = g;
    }
    frag.appendChild(make(ch));
  }
  return frag;
}

function render() {
  const list = $('list'); list.innerHTML = '';
  list.appendChild(grouped(channels, ch => {
    const b = document.createElement('button');
    b.className = 'ch' + (current && current.id === ch.id ? ' active' : '');
    b.innerHTML = `<span class="num">${ch.number}</span><span class="meta"><div class="name"></div><div class="now"></div><div class="next"></div></span>`;
    b.querySelector('.name').textContent = ch.name;
    b.querySelector('.now').textContent = ch.kind === 'guide' ? 'Live guide' : 'Now: ' + label(ch.now);
    b.querySelector('.next').textContent = ch.next ? `${fmt(ch.next.start_ms)}: ${label(ch.next)}` : '';
    b.onclick = () => selectChannel(ch);
    return b;
  }));
  if (current) {
    const c = channels.find(c => c.id === current.id) || current;
    $('t').textContent = `${c.number}  ${c.name}`;
    $('s').textContent = c.now ? `Now: ${label(c.now)}${c.next ? '  ·  Next: ' + label(c.next) : ''}` : (c.kind === 'guide' ? 'Live guide' : '');
  }
}

function selectChannel(ch) {
  if (tvId || remoteId) sendTv({ channel: ch.number }); else play(ch);
}

function step(dir) {
  if (!channels.length) return;
  const i = current ? channels.findIndex(c => c.id === current.id) : -1;
  const n = (i + (dir === 'up' ? 1 : -1) + channels.length) % channels.length;
  selectChannel(channels[n]);
}

async function refresh() {
  try { channels = await api('/channels'); } catch { return; }
  if (current) current = channels.find(c => c.id === current.id) || current;
  if (remoteId) renderRemote(); else render();
}

// ---- Talking to the server: WebSocket for live updates, REST as the fallback ----
function sendTv(fields) {
  const id = tvId || remoteId;
  if (ws && wsOk) { ws.send(JSON.stringify({ type: 'tv', id, ...fields })); return Promise.resolve(); }
  // REST fallback
  if ('channel' in fields) return post(`/tvs/${id}/channel`, { number: fields.channel }).then(applyTv).catch(() => {});
  if ('step' in fields) return post(`/tvs/${id}/channel`, { step: fields.step }).then(applyTv).catch(() => {});
  if ('power' in fields) return post(`/tvs/${id}/power`, { on: fields.power }).then(applyTv).catch(() => {});
  return post(`/tvs/${id}/volume`, { level: fields.volume, muted: fields.muted }).then(applyTv).catch(() => {});
}

function connect() {
  if (!tvId && !remoteId) { /* the plain player still listens for programme changes */ }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/api/v1/ws${tq}`);
  ws.onopen = () => {
    wsOk = true;
    if (tvId) ws.send(JSON.stringify({ type: 'hello', tv: tvId }));
  };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'snapshot') {
      const mine = m.tvs.find(t => t.id === (tvId || remoteId));
      if (mine) applyTv(mine);
    } else if (m.type === 'tv.state') {
      if (m.tv.id === (tvId || remoteId)) applyTv(m.tv);
    } else if (m.type === 'channel.now') {
      const c = channels.find(c => c.id === m.channel);
      if (c) { c.now = m.now; c.next = m.next; remoteId ? renderRemote() : render(); }
    } else if (m.type === 'schedule.changed') {
      refresh();
    }
  };
  ws.onclose = () => { wsOk = false; setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
}

// ---- Virtual TV mode: follow the remote ----
function applyTv(tv) {
  tvState = tv;
  if (remoteId) { renderRemote(); return; }
  if (!tvId) return;
  $('off').style.display = tv.power ? 'none' : 'flex';
  if (!tv.power) { v.pause(); current = null; return; }
  v.muted = tv.muted; v.volume = tv.volume / 100;
  const ch = channels.find(c => c.number === tv.channel);
  if (ch && (!current || current.id !== ch.id)) play(ch);
}

async function pollTv() {
  if (wsOk) return;               // the socket keeps us current
  try { applyTv(await api(`/tvs/${tvId || remoteId}`)); } catch {}
}

// ---- Remote mode ----
function renderRemote() {
  const t = tvState;
  $('rtitle').innerHTML = t
    ? `<span class="dot ${t.online ? 'on' : ''}"></span>Remote — ${t.name}${t.online ? '' : ' (not connected)'}`
    : 'Remote — TV not registered';
  $('rpower').textContent = t && t.power ? 'Power: On' : 'Power: Off';
  $('rmute').textContent = t && t.muted ? 'Unmute' : 'Mute';
  const list = $('rlist'); list.innerHTML = '';
  list.appendChild(grouped(channels, ch => {
    const b = document.createElement('button');
    b.className = 'ch' + (t && t.channel === ch.number ? ' active' : '');
    b.innerHTML = `<span class="num">${ch.number}</span><span class="meta"><div class="name"></div><div class="now"></div></span>`;
    b.querySelector('.name').textContent = ch.name;
    b.querySelector('.now').textContent = ch.kind === 'guide' ? 'Live guide' : 'Now: ' + label(ch.now);
    b.onclick = () => sendTv({ channel: ch.number });
    return b;
  }));
}

// ---- The remote: channel keys, number entry, the channel list ----
let entry = '', entryTimer = null, bannerTimer = null, pickerOpen = false, pickIndex = 0, pickerTimer = null;

function banner() {
  const c = current && (channels.find(x => x.id === current.id) || current);
  if (!c) return;
  const b = $('banner');
  b.querySelector('.b-num').textContent = c.number;
  b.querySelector('.b-name').textContent = c.name;
  b.querySelector('.b-now').textContent = c.kind === 'guide' ? 'Live guide' : c.now ? `Now: ${label(c.now)}` : '';
  b.querySelector('.b-next').textContent = c.next ? `Next ${fmt(c.next.start_ms)}: ${label(c.next)}` : '';
  b.classList.add('show');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => b.classList.remove('show'), 4500);
}

function goTo(ch) { if (ch) selectChannel(ch); }

function typeDigit(d) {
  entry = (entry + d).slice(0, 4);
  const e = $('entry'); e.innerHTML = `${entry}<small>${(channels.find(c => String(c.number) === entry) || {}).name || 'Channel'}</small>`; e.classList.add('show');
  clearTimeout(entryTimer); entryTimer = setTimeout(commitEntry, 1600);
}
function commitEntry() {
  clearTimeout(entryTimer);
  const n = entry; entry = ''; $('entry').classList.remove('show');
  if (!n) return;
  const ch = channels.find(c => String(c.number) === String(Number(n)));
  if (ch) goTo(ch); else { const o = $('osd'); o.textContent = `No channel ${Number(n)}`; o.classList.add('show'); clearTimeout(osdTimer); osdTimer = setTimeout(() => o.classList.remove('show'), 2000); }
}

function renderPicker() {
  const l = $('plist'); l.innerHTML = '';
  // Show a window of rows around the highlighted one so a long list stays on screen.
  const rows = Math.max(5, Math.floor(($('stage').clientHeight - 120) / 72));
  const first = Math.max(0, Math.min(pickIndex - Math.floor(rows / 2), channels.length - rows));
  channels.slice(first, first + rows).forEach((c, i) => {
    const r = document.createElement('div');
    r.className = 'row' + (first + i === pickIndex ? ' sel' : '') + (current && current.id === c.id ? ' cur' : '');
    r.innerHTML = '<span class="num"></span><span class="col"><div class="nm"></div><div class="nw"></div></span>';
    r.querySelector('.num').textContent = c.number;
    r.querySelector('.nm').textContent = c.name;
    r.querySelector('.nw').textContent = c.kind === 'guide' ? 'Live guide' : c.now ? label(c.now) : '';
    r.onclick = () => { pickIndex = first + i; pickerSelect(); };
    l.appendChild(r);
  });
}
function openPicker() {
  if (!channels.length) return;
  pickerOpen = true; pickIndex = Math.max(0, current ? channels.findIndex(c => c.id === current.id) : 0);
  $('banner').classList.remove('show'); $('picker').classList.add('show'); renderPicker(); touchPicker();
}
function closePicker() { pickerOpen = false; $('picker').classList.remove('show'); clearTimeout(pickerTimer); }
function touchPicker() { clearTimeout(pickerTimer); pickerTimer = setTimeout(closePicker, 15000); }
function pickerSelect() { const c = channels[pickIndex]; closePicker(); goTo(c); }

function keyName(e) {
  const k = e.key, c = e.keyCode;
  if (/^[0-9]$/.test(k)) return 'digit';
  if (k === 'ChannelUp' || c === 427 || c === 166 || k === 'PageUp' || c === 33) return 'chup';
  if (k === 'ChannelDown' || c === 428 || c === 167 || k === 'PageDown' || c === 34) return 'chdown';
  if (k === 'ArrowUp' || c === 38) return 'up';
  if (k === 'ArrowDown' || c === 40) return 'down';
  if (k === 'ArrowLeft' || c === 37) return 'left';
  if (k === 'ArrowRight' || c === 39) return 'right';
  if (k === 'Enter' || c === 13 || c === 29443) return 'ok';
  if (k === 'Escape' || k === 'GoBack' || k === 'BrowserBack' || c === 10009 || c === 461 || c === 27) return 'back';
  if (k === 'Info' || c === 457 || k === 'i' || c === 405) return 'info';
  if (k === 'ColorF0Red' || c === 403) return 'list';
  if (k === 'ColorF1Green' || c === 404) return 'guide';
  if (k === 'MediaPlayPause' || k === 'MediaPlay' || k === 'MediaPause' || c === 415 || c === 19 || c === 179 || c === 10252) return 'playpause';
  if (k === 'f' || c === 406) return 'fullscreen';
  return '';
}

addEventListener('keydown', e => {
  if (remoteId || e.altKey || e.ctrlKey || e.metaKey) return;
  const key = keyName(e);
  if (!key) return;
  // On a computer the side list keeps Enter, Left, Right and Escape for itself.
  if (!tvui && !pickerOpen && ['ok', 'left', 'right', 'list', 'back'].includes(key) && !$('start').classList.contains('show')) return;
  if ($('start').classList.contains('show') && key === 'ok') { e.preventDefault(); v.muted = false; v.play().then(() => $('start').classList.remove('show')).catch(() => {}); return; }
  if (pickerOpen) {
    e.preventDefault(); touchPicker();
    if (key === 'up' || key === 'chup') pickIndex = (pickIndex - 1 + channels.length) % channels.length;
    else if (key === 'down' || key === 'chdown') pickIndex = (pickIndex + 1) % channels.length;
    else if (key === 'ok' || key === 'right') return pickerSelect();
    else if (key === 'back' || key === 'left' || key === 'list') return closePicker();
    else if (key === 'digit') { closePicker(); return typeDigit(e.key); }
    renderPicker(); return;
  }
  if (entry && key === 'ok') { e.preventDefault(); return commitEntry(); }
  switch (key) {
    case 'digit': e.preventDefault(); typeDigit(e.key); break;
    case 'up': case 'chup': e.preventDefault(); step('up'); break;
    case 'down': case 'chdown': e.preventDefault(); step('down'); break;
    case 'left': if (previous) { e.preventDefault(); goTo(channels.find(c => c.id === previous.id)); } break;
    case 'right': case 'ok': case 'list': e.preventDefault(); openPicker(); break;
    case 'info': e.preventDefault(); banner(); break;
    case 'guide': { const g = channels.find(c => c.kind === 'guide'); if (g) { e.preventDefault(); goTo(g); } break; }
    case 'playpause': e.preventDefault(); v.paused ? v.play().catch(() => {}) : v.pause(); break;
    case 'fullscreen': document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen().catch(() => {}); break;
    case 'back': if (entry) { entry = ''; $('entry').classList.remove('show'); e.preventDefault(); } break;
  }
});
// Keep the TV awake while a channel is on.
async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && tvui) keepAwake(); });

(async function main() {
  if (remoteId) {
    document.body.classList.add('remote');
    $('rup').onclick = () => sendTv({ step: 'up' });
    $('rdown').onclick = () => sendTv({ step: 'down' });
    $('rpower').onclick = () => sendTv({ power: !(tvState && tvState.power) });
    $('rmute').onclick = () => sendTv({ muted: !(tvState && tvState.muted) });
    $('rvolm').onclick = () => sendTv({ volume: Math.max(0, ((tvState && tvState.volume) || 50) - 5) });
    $('rvolp').onclick = () => sendTv({ volume: Math.min(100, ((tvState && tvState.volume) || 50) + 5) });
    await refresh(); connect(); setInterval(pollTv, 5000); setInterval(refresh, 30000);
    return;
  }
  await refresh();
  if (tvId) {
    document.body.classList.add('tv');
    // Register only if new, so a friendly name set elsewhere is not overwritten.
    await api(`/tvs/${tvId}`).catch(() => post('/tvs', { id: tvId, name: tvId }).catch(() => {}));
    connect(); await pollTv(); setInterval(pollTv, 5000);
    try { applyTv(await api(`/tvs/${tvId}`)); } catch {}
  } else {
    connect();
    if (tvui) { document.body.classList.add('tvui'); keepAwake(); }
    // Start where you left off (or on the channel in ?channel=), else the first.
    const want = q.get('channel'), last = store.get('tvmaster.channel');
    const start = channels.find(c => String(c.number) === want || c.id === want) || channels.find(c => c.id === last) || channels[0];
    if (start) play(start);
  }
  setInterval(refresh, 30000);
})();
</script>

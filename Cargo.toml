[workspace]
resolver = "2"
# The desktop shell is built separately (it needs Tauri's system dependencies).
exclude = ["apps/desktop/src-tauri"]
members = [
    "crates/tvmaster-core",
    "crates/tvmaster-db",
    "crates/tvmaster-media",
    "crates/tvmaster-playout",
    "crates/tvmaster-render",
    "crates/tvmaster-server",
    "crates/tvmaster-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
if-addrs = "0.13"
gethostname = "0.5"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
axum = { version = "0.7", features = ["ws"] }
fontdue = { version = "0.9", default-features = false, features = ["std"] }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
regex = "1"
walkdir = "2"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "sync", "time", "fs"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
getrandom = "0.2"
rust-embed = "8"
tokio-stream = "0.1"
tokio-tungstenite = "0.24"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tvmaster-core = { path = "crates/tvmaster-core" }
tvmaster-db = { path = "crates/tvmaster-db" }
tvmaster-media = { path = "crates/tvmaster-media" }
tvmaster-playout = { path = "crates/tvmaster-playout" }
tvmaster-render = { path = "crates/tvmaster-render" }
tvmaster-server = { path = "crates/tvmaster-server" }

# Debug builds and test binaries were growing past 20 GB; line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"

name: Release

# Push a tag like v0.1.0 to build and publish the release. You can also run it
# by hand (Actions > Release > Run workflow) to get the archives as workflow
# artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon:
    name: daemon (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  pkgarch: amd64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, pkgarch: arm64 }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.target }} dist
      - name: Linux packages (.deb, .rpm, Arch)
        if: matrix.pkgarch != ''
        run: packaging/linux/build.sh target/${{ matrix.target }}/release/tvmaster ${{ matrix.pkgarch }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: tvmaster-${{ matrix.target }}
          path: dist/*

  windows-installer:
    name: Windows installer (${{ matrix.arch }})
    needs: daemon
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: x64,   target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tvmaster-${{ matrix.target }}
          path: win
      - name: Build the installer (NSIS runs fine on Linux)
        run: |
          sudo apt-get update && sudo apt-get install -y nsis osslsigncode
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          unzip -q win/tvmaster-*.zip -d win/x
          mkdir -p dist
          makensis -V2 -DVERSION="$VERSION" -DARCH=${{ matrix.arch }} \
            -DEXE="$PWD/$(ls win/x/*/tvmaster.exe)" \
            -DOUT="$PWD/dist/TVMaster-$VERSION-${{ matrix.arch }}-setup.exe" packaging/windows/tvmaster.nsi
      - name: Sign (only when a certificate is configured)
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$PFX_B64" ]; then echo "No WINDOWS_CERT_PFX_BASE64 secret: the installer is unsigned."; exit 0; fi
          echo "$PFX_B64" | base64 -d > cert.pfx
          for f in dist/*-setup.exe; do WINDOWS_CERT_PFX=cert.pfx packaging/windows/sign.sh "$f"; done
          rm cert.pfx
      - run: cd dist && sha256sum *.exe > "$(ls *.exe | head -1).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tvmaster-windows-installer-${{ matrix.arch }}
          path: dist/*

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Universal daemon
        run: |
          cargo build --release --locked -p tvmaster-cli --target aarch64-apple-darwin
          cargo build --release --locked -p tvmaster-cli --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/tvmaster \
            target/aarch64-apple-darwin/release/tvmaster \
            target/x86_64-apple-darwin/release/tvmaster
      - name: Test the Swift package
        working-directory: apps/macos
        run: swift test
      - name: Import the Developer ID certificate (only when configured)
        id: sign
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$P12" ]; then echo "No MACOS_CERT_P12_BASE64 secret: the app is ad-hoc signed and not notarized."; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
      - name: Build TVMaster.app (universal)
        working-directory: apps/macos
        env:
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: UNIVERSAL=1 Scripts/build-app.sh
      - name: Store notarization credentials (only when configured)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ]; then echo "No notarization secrets."; exit 0; fi
          xcrun notarytool store-credentials tvmaster --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARIZE=1" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=tvmaster" >> "$GITHUB_ENV"
      - name: Disk image
        working-directory: apps/macos
        env:
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: Scripts/build-dmg.sh
      - name: Checksums
        working-directory: apps/macos/build
        run: shasum -a 256 TVMaster-*.dmg > "TVMaster-$(cat ../VERSION).dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tvmaster-macos-app
          path: apps/macos/build/TVMaster-*

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tvmaster:ci
      - name: The container starts and reports healthy
        run: |
          docker run -d --name t -p 8787:8787 tvmaster:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/v1/health && exit 0; sleep 1; done
          docker logs t; exit 1

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [daemon, windows-installer, macos-app, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          cat *.sha256 > SHA256SUMS
          # 0.x releases are marked as pre-releases.
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "TVMaster ${GITHUB_REF_NAME}" --generate-notes --prerelease *
